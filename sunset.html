<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gün Batımı — Işığı Yakala</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #0b0b2b; touch-action: none;
        font-family: 'Trebuchet MS', 'Segoe UI', Tahoma, sans-serif;
        color: #fff8ec; user-select: none; -webkit-user-select: none;
    }

    #game { display: block; width: 100vw; height: 100vh; }

    /* --- Arayüz katmanı --- */
    #hud {
        position: absolute; inset: 0; pointer-events: none;
        display: flex; flex-direction: column; justify-content: space-between;
        padding: 18px 20px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, .55);
    }

    .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }

    .label { font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; opacity: .75; }
    .value { font-size: 1.8rem; font-weight: bold; line-height: 1.1; }
    .value.small { font-size: 1.15rem; }

    #comboTag {
        display: inline-block; margin-left: 8px; font-size: .95rem;
        color: #ffd76a; opacity: 0; transition: opacity .2s;
    }
    #comboTag.on { opacity: 1; }

    .right { text-align: right; }

    /* Güneş çubuğu */
    #sunMeter {
        width: min(320px, 46vw); height: 12px; margin-top: 8px;
        background: rgba(0, 0, 0, .35); border: 2px solid rgba(255, 220, 150, .7);
        border-radius: 8px; overflow: hidden;
    }
    #sunFill {
        height: 100%; width: 100%;
        background: linear-gradient(90deg, #ff5f6d, #ffb347, #ffe9a8);
        box-shadow: 0 0 14px rgba(255, 180, 90, .8);
        transition: width .12s linear;
    }
    #sunMeter.low { border-color: #ff7a7a; animation: pulse .7s infinite alternate; }
    @keyframes pulse { from { box-shadow: 0 0 0 rgba(255,90,90,0); } to { box-shadow: 0 0 18px rgba(255,90,90,.9); } }

    /* --- Ekranlar --- */
    .screen {
        position: absolute; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 24px; text-align: center;
        background: radial-gradient(ellipse at 50% 60%, rgba(255, 150, 80, .18), rgba(10, 8, 30, .82) 65%);
        backdrop-filter: blur(3px);
    }
    .screen.hidden { display: none; }

    .screen h1 {
        font-size: clamp(2rem, 7vw, 3.4rem); letter-spacing: .04em;
        background: linear-gradient(180deg, #fff3d0, #ffb347 60%, #ff6b6b);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 4px 18px rgba(255, 140, 60, .45));
    }
    .screen p { max-width: 460px; line-height: 1.6; opacity: .9; font-size: .98rem; }
    .screen .keys { font-size: .85rem; opacity: .7; }

    .btn {
        pointer-events: auto; cursor: pointer; margin-top: 10px;
        padding: 13px 34px; font-size: 1.05rem; font-weight: bold; font-family: inherit;
        color: #3a1a05; background: linear-gradient(180deg, #ffe1a1, #ffab52);
        border: none; border-radius: 999px;
        box-shadow: 0 8px 24px rgba(255, 140, 50, .35);
        transition: transform .12s, box-shadow .12s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255, 140, 50, .5); }
    .btn:active { transform: translateY(1px); }

    .stats { display: flex; gap: 28px; margin-top: 6px; }
    .stats div { min-width: 90px; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
    <div class="row">
        <div>
            <div class="label">Puan</div>
            <div class="value"><span id="score">0</span><span id="comboTag">x1</span></div>
        </div>
        <div class="right">
            <div class="label">Saat</div>
            <div class="value small" id="clock">18:00</div>
        </div>
    </div>
    <div class="row">
        <div>
            <div class="label">Güneş</div>
            <div id="sunMeter"><div id="sunFill"></div></div>
        </div>
        <div class="right">
            <div class="label">Rekor</div>
            <div class="value small" id="best">0</div>
        </div>
    </div>
</div>

<div class="screen" id="startScreen">
    <h1>Gün Batımı</h1>
    <p>Güneş ufka doğru iniyor. Altın ışık küreleri topla ve batmasını geciktir —
       kara bulutlara çarparsan gece daha da yaklaşır.</p>
    <p class="keys">Fare / dokunmatik ile sürükle &nbsp;·&nbsp; ↑ ↓ veya W S</p>
    <button class="btn" id="startBtn">Başla</button>
</div>

<div class="screen hidden" id="overScreen">
    <h1>Güneş Battı</h1>
    <div class="stats">
        <div><div class="label">Puan</div><div class="value" id="finalScore">0</div></div>
        <div><div class="label">Süre</div><div class="value" id="finalTime">0s</div></div>
    </div>
    <p id="verdict"></p>
    <button class="btn" id="retryBtn">Tekrar Dene</button>
</div>

<script>
"use strict";

/* ==========================================================================
   Gün Batımı — tek dosyalık canvas oyunu
   Amaç: altın ışık kürelerini toplayarak güneşin batmasını geciktirmek.
   ========================================================================== */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const el = {
    score:      document.getElementById('score'),
    best:       document.getElementById('best'),
    clock:      document.getElementById('clock'),
    combo:      document.getElementById('comboTag'),
    sunMeter:   document.getElementById('sunMeter'),
    sunFill:    document.getElementById('sunFill'),
    start:      document.getElementById('startScreen'),
    over:       document.getElementById('overScreen'),
    finalScore: document.getElementById('finalScore'),
    finalTime:  document.getElementById('finalTime'),
    verdict:    document.getElementById('verdict'),
};

let W = 0, H = 0, horizon = 0;

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    horizon = H * 0.70;
}
window.addEventListener('resize', resize);
resize();

/* --------------------------------------------------------------------------
   Renk paleti: güneş yüksekliğine (sun: 1 → 0) göre gökyüzü tonları
   -------------------------------------------------------------------------- */

const SKY_STOPS = [
    { at: 1.00, top: [ 42, 111, 176], mid: [140, 190, 224], low: [255, 217, 160] },
    { at: 0.66, top: [ 31,  78, 140], mid: [232, 132,  92], low: [255, 210, 122] },
    { at: 0.33, top: [ 42,  42, 107], mid: [179,  74, 114], low: [255, 140,  66] },
    { at: 0.00, top: [ 11,  11,  43], mid: [ 43,  27,  74], low: [107,  43,  74] },
];

const lerp  = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function mixRGB(a, b, t) {
    return [
        Math.round(lerp(a[0], b[0], t)),
        Math.round(lerp(a[1], b[1], t)),
        Math.round(lerp(a[2], b[2], t)),
    ];
}

function skyColors(sun) {
    let hi = SKY_STOPS[0], lo = SKY_STOPS[SKY_STOPS.length - 1];
    for (let i = 0; i < SKY_STOPS.length - 1; i++) {
        if (sun <= SKY_STOPS[i].at && sun >= SKY_STOPS[i + 1].at) {
            hi = SKY_STOPS[i]; lo = SKY_STOPS[i + 1];
            break;
        }
    }
    const span = hi.at - lo.at;
    const t = span === 0 ? 0 : (hi.at - sun) / span;
    return {
        top: mixRGB(hi.top, lo.top, t),
        mid: mixRGB(hi.mid, lo.mid, t),
        low: mixRGB(hi.low, lo.low, t),
    };
}

const rgb  = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const shade = (c, f) => [Math.round(c[0] * f), Math.round(c[1] * f), Math.round(c[2] * f)];

/* --------------------------------------------------------------------------
   Oyun durumu
   -------------------------------------------------------------------------- */

const STATE = { MENU: 0, PLAY: 1, OVER: 2 };

const game = {
    state: STATE.MENU,
    sun: 1,            // 1 = tepede, 0 = battı
    score: 0,
    best: 0,
    combo: 1,
    comboTimer: 0,
    elapsed: 0,
    scroll: 0,
    speed: 210,        // px/sn — dünyanın akış hızı
    shake: 0,
    flash: 0,
    spawnOrb: 0,
    spawnCloud: 0,
};

try { game.best = parseInt(localStorage.getItem('sunsetBest') || '0', 10) || 0; } catch (e) { /* yok say */ }
el.best.textContent = game.best;

const player = { x: 0, y: 0, targetY: 0, vy: 0, wing: 0, tilt: 0, hurt: 0 };
const orbs = [];
const clouds = [];
const particles = [];
const stars = [];
const birds = [];

function makeStars() {
    stars.length = 0;
    const n = Math.round((W * H) / 9000);
    for (let i = 0; i < n; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * horizon * 0.92,
            r: Math.random() * 1.3 + 0.4,
            ph: Math.random() * Math.PI * 2,
        });
    }
}
makeStars();
window.addEventListener('resize', makeStars);

function reset() {
    game.sun = 1;
    game.score = 0;
    game.combo = 1;
    game.comboTimer = 0;
    game.elapsed = 0;
    game.scroll = 0;
    game.speed = 210;
    game.shake = 0;
    game.flash = 0;
    game.spawnOrb = 0.6;
    game.spawnCloud = 2.4;

    orbs.length = 0; clouds.length = 0; particles.length = 0; birds.length = 0;

    player.x = W * 0.26;
    player.y = player.targetY = horizon * 0.55;
    player.vy = 0; player.tilt = 0; player.hurt = 0;
}

/* --------------------------------------------------------------------------
   Girdi
   -------------------------------------------------------------------------- */

const keys = Object.create(null);
let pointerActive = false;

window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if ([' ', 'arrowup', 'arrowdown'].includes(e.key.toLowerCase())) e.preventDefault();
    if (e.key === 'Enter' && game.state !== STATE.PLAY) startGame();
}, { passive: false });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function pointTo(clientY) {
    pointerActive = true;
    player.targetY = clamp(clientY, 24, horizon - 10);
}

canvas.addEventListener('pointerdown', e => pointTo(e.clientY));
canvas.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') pointTo(e.clientY); });
canvas.addEventListener('pointerup',   () => { pointerActive = false; });
canvas.addEventListener('pointerleave',() => { pointerActive = false; });

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

function startGame() {
    reset();
    game.state = STATE.PLAY;
    el.start.classList.add('hidden');
    el.over.classList.add('hidden');
}

function endGame() {
    game.state = STATE.OVER;
    if (game.score > game.best) {
        game.best = game.score;
        try { localStorage.setItem('sunsetBest', String(game.best)); } catch (e) { /* yok say */ }
    }
    el.best.textContent = game.best;
    el.finalScore.textContent = game.score;
    el.finalTime.textContent = Math.floor(game.elapsed) + 's';
    el.verdict.textContent =
        game.score >= 1500 ? 'Ufku bir hayli zorladın. Gökyüzü seni hatırlayacak.' :
        game.score >=  600 ? 'Güzel bir akşam oldu. Biraz daha ışık toplayabilirdin.' :
                             'Gece çabuk çöktü. Altın kürelerin peşini bırakma.';
    el.over.classList.remove('hidden');
}

/* --------------------------------------------------------------------------
   Nesne üretimi
   -------------------------------------------------------------------------- */

function spawnOrb() {
    const y = 40 + Math.random() * (horizon - 90);
    orbs.push({
        x: W + 40, y, base: y,
        r: 11,
        amp: Math.random() * 46,
        freq: 0.7 + Math.random() * 1.1,
        ph: Math.random() * Math.PI * 2,
        t: 0,
        big: Math.random() < 0.14,   // nadir "gün ışığı" küresi
    });
}

function spawnCloud() {
    const y = 60 + Math.random() * (horizon - 130);
    clouds.push({
        x: W + 120,
        y,
        w: 90 + Math.random() * 110,
        h: 34 + Math.random() * 26,
        drift: (Math.random() - 0.5) * 18,
        seed: Math.random() * 100,
    });
}

function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 40 + Math.random() * 190;
        particles.push({
            x, y,
            vx: Math.cos(a) * s, vy: Math.sin(a) * s,
            life: 0.5 + Math.random() * 0.5, max: 1,
            r: 1.5 + Math.random() * 2.5,
            color,
        });
    }
}

/* --------------------------------------------------------------------------
   Güncelleme
   -------------------------------------------------------------------------- */

function update(dt) {
    // Menü ve bitiş ekranlarında da arka plan yavaşça aksın
    game.scroll += (game.state === STATE.PLAY ? game.speed : 40) * dt;

    if (game.state !== STATE.PLAY) {
        updateParticles(dt);
        return;
    }

    game.elapsed += dt;
    game.speed = 210 + Math.min(160, game.elapsed * 3.2);

    // Güneş sürekli batar, zamanla hızlanır
    const drain = 0.0105 + Math.min(0.011, game.elapsed * 0.00022);
    game.sun = clamp(game.sun - drain * dt, 0, 1);
    if (game.sun <= 0) { endGame(); return; }

    // --- Oyuncu hareketi ---
    if (keys['arrowup'] || keys['w'])   { player.targetY -= 520 * dt; pointerActive = false; }
    if (keys['arrowdown'] || keys['s']) { player.targetY += 520 * dt; pointerActive = false; }
    player.targetY = clamp(player.targetY, 24, horizon - 10);

    const prevY = player.y;
    player.y += (player.targetY - player.y) * Math.min(1, dt * 9);
    player.vy = (player.y - prevY) / Math.max(dt, 0.0001);
    player.tilt = clamp(player.vy / 900, -0.5, 0.5);
    player.wing += dt * (7 + Math.abs(player.vy) * 0.012);
    if (player.hurt > 0) player.hurt -= dt;

    // --- Kombo zamanlayıcı ---
    if (game.comboTimer > 0) {
        game.comboTimer -= dt;
        if (game.comboTimer <= 0) game.combo = 1;
    }

    // --- Üretim ---
    game.spawnOrb -= dt;
    if (game.spawnOrb <= 0) {
        spawnOrb();
        game.spawnOrb = 0.52 + Math.random() * 0.5;
    }
    game.spawnCloud -= dt;
    if (game.spawnCloud <= 0) {
        spawnCloud();
        game.spawnCloud = Math.max(0.85, 2.3 - game.elapsed * 0.016) + Math.random() * 0.9;
    }
    if (Math.random() < dt * 0.25) {
        birds.push({ x: W + 30, y: 40 + Math.random() * horizon * 0.45, s: 0.5 + Math.random() * 0.7, ph: Math.random() * 6 });
    }

    // --- Küreler ---
    for (let i = orbs.length - 1; i >= 0; i--) {
        const o = orbs[i];
        o.t += dt;
        o.x -= game.speed * dt;
        o.y = o.base + Math.sin(o.t * o.freq + o.ph) * o.amp;

        const dx = o.x - player.x, dy = o.y - player.y;
        if (dx * dx + dy * dy < (o.r + 17) * (o.r + 17)) {
            const gain = o.big ? 0.11 : 0.038;
            game.sun = clamp(game.sun + gain, 0, 1);
            game.combo = Math.min(9, game.combo + 1);
            game.comboTimer = 2.6;
            game.score += (o.big ? 60 : 15) * game.combo;
            burst(o.x, o.y, o.big ? [255, 245, 200] : [255, 205, 110], o.big ? 26 : 14);
            orbs.splice(i, 1);
            continue;
        }
        if (o.x < -50) orbs.splice(i, 1);
    }

    // --- Kara bulutlar ---
    for (let i = clouds.length - 1; i >= 0; i--) {
        const c = clouds[i];
        c.x -= (game.speed * 0.85) * dt;
        c.y += c.drift * dt;
        c.y = clamp(c.y, 50, horizon - 60);

        const dx = Math.abs(c.x - player.x), dy = Math.abs(c.y - player.y);
        if (dx < c.w * 0.42 && dy < c.h * 0.5 && player.hurt <= 0) {
            game.sun = clamp(game.sun - 0.115, 0, 1);
            game.combo = 1; game.comboTimer = 0;
            game.shake = 14;
            game.flash = 0.5;
            player.hurt = 1.1;
            burst(player.x, player.y, [90, 80, 120], 20);
            clouds.splice(i, 1);
            if (game.sun <= 0) { endGame(); return; }
            continue;
        }
        if (c.x < -260) clouds.splice(i, 1);
    }

    for (let i = birds.length - 1; i >= 0; i--) {
        const b = birds[i];
        b.x -= (game.speed * 0.5 + 20) * dt;
        b.ph += dt * 6;
        if (b.x < -40) birds.splice(i, 1);
    }

    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 30);
    if (game.flash > 0) game.flash = Math.max(0, game.flash - dt * 1.6);

    updateParticles(dt);
    updateHUD();
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 120 * dt;
        p.vx *= 0.96;
    }
}

function updateHUD() {
    el.score.textContent = game.score;
    el.sunFill.style.width = (game.sun * 100).toFixed(1) + '%';
    el.sunMeter.classList.toggle('low', game.sun < 0.25);

    // 18:00 → 20:00 arası bir akşam saati
    const minutes = Math.round((1 - game.sun) * 120);
    const hh = 18 + Math.floor(minutes / 60);
    const mm = minutes % 60;
    el.clock.textContent = hh + ':' + String(mm).padStart(2, '0');

    el.combo.textContent = 'x' + game.combo;
    el.combo.classList.toggle('on', game.combo > 1);
}

/* --------------------------------------------------------------------------
   Çizim
   -------------------------------------------------------------------------- */

function ridge(yBase, amp, speedFactor, color, detail) {
    const off = game.scroll * speedFactor;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W + 4; x += 6) {
        const wx = (x + off) * 0.0025;
        const y = yBase
            - Math.sin(wx) * amp
            - Math.sin(wx * 2.7 + 1.3) * amp * 0.38
            - Math.sin(wx * 6.1 + 2.2) * amp * detail;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
}

function drawSun(col) {
    const sx = W * 0.74;
    const sy = horizon - (game.sun * horizon * 0.60) + 10;
    const r  = Math.min(W, H) * 0.085;

    // Hale
    const halo = ctx.createRadialGradient(sx, sy, r * 0.4, sx, sy, r * 6);
    halo.addColorStop(0, rgba(col.low, 0.55));
    halo.addColorStop(0.35, rgba(col.low, 0.16));
    halo.addColorStop(1, rgba(col.low, 0));
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(sx, sy, r * 6, 0, Math.PI * 2); ctx.fill();

    // Disk
    const disc = ctx.createRadialGradient(sx, sy - r * 0.2, r * 0.1, sx, sy, r);
    disc.addColorStop(0, '#fffbe8');
    disc.addColorStop(0.55, rgb(col.low));
    disc.addColorStop(1, rgb(mixRGB(col.low, [255, 90, 60], 0.55)));
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();

    return { sx, sy, r };
}

function drawSea(col, sunPos) {
    const seaTop = shade(col.low, 0.42);
    const seaBot = shade(col.top, 0.30);
    const g = ctx.createLinearGradient(0, horizon, 0, H);
    g.addColorStop(0, rgb(seaTop));
    g.addColorStop(1, rgb(seaBot));
    ctx.fillStyle = g;
    ctx.fillRect(0, horizon, W, H - horizon);

    // Güneşin sudaki yansıması
    const t = performance.now() / 1000;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, horizon, W, H - horizon); ctx.clip();
    for (let y = horizon; y < H; y += 6) {
        const d = (y - horizon) / (H - horizon);
        const wobble = Math.sin(y * 0.35 + t * 2.4) * (8 + d * 40);
        const wdt = sunPos.r * (0.8 + d * 2.2);
        ctx.fillStyle = rgba(col.low, (1 - d) * 0.30 * (0.6 + 0.4 * Math.sin(y * 0.9 + t * 3)));
        ctx.fillRect(sunPos.sx + wobble - wdt / 2, y, wdt, 3);
    }
    ctx.restore();

    // Ufuk çizgisindeki parlaklık
    ctx.fillStyle = rgba(col.low, 0.35);
    ctx.fillRect(0, horizon - 1.5, W, 3);
}

function drawStars(alpha) {
    if (alpha <= 0.01) return;
    const t = performance.now() / 700;
    for (const s of stars) {
        const tw = 0.55 + 0.45 * Math.sin(t + s.ph);
        ctx.fillStyle = `rgba(255,252,235,${alpha * tw})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
}

function drawPlayer() {
    const flap = Math.sin(player.wing) * 0.9;
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.tilt);

    if (player.hurt > 0) ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(player.hurt * 26));

    // Sıcak ışık halesi
    const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 34);
    glow.addColorStop(0, 'rgba(255,214,140,.55)');
    glow.addColorStop(1, 'rgba(255,214,140,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2); ctx.fill();

    // Gövde
    ctx.fillStyle = '#2a1830';
    ctx.beginPath();
    ctx.ellipse(0, 0, 17, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Kanatlar
    ctx.fillStyle = '#1d1024';
    ctx.beginPath();
    ctx.moveTo(-2, -2);
    ctx.quadraticCurveTo(-16, -14 - flap * 12, -26, -4 - flap * 8);
    ctx.quadraticCurveTo(-14, 2, -2, 3);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(2, -2);
    ctx.quadraticCurveTo(10, -12 - flap * 10, 20, -6 - flap * 6);
    ctx.quadraticCurveTo(10, 2, 2, 3);
    ctx.fill();

    // Gaga ve kuyruk
    ctx.fillStyle = '#ffb347';
    ctx.beginPath();
    ctx.moveTo(16, -1); ctx.lineTo(25, 1); ctx.lineTo(16, 4);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#2a1830';
    ctx.beginPath();
    ctx.moveTo(-15, -1); ctx.lineTo(-27, -6); ctx.lineTo(-25, 4);
    ctx.closePath(); ctx.fill();

    ctx.restore();
}

function drawOrb(o) {
    const t = performance.now() / 1000;
    const pulse = 1 + Math.sin(t * 5 + o.ph) * 0.12;
    const r = o.r * (o.big ? 1.6 : 1) * pulse;

    const g = ctx.createRadialGradient(o.x, o.y, 1, o.x, o.y, r * 3.2);
    g.addColorStop(0, 'rgba(255,250,220,.95)');
    g.addColorStop(0.28, o.big ? 'rgba(255,240,170,.7)' : 'rgba(255,200,110,.55)');
    g.addColorStop(1, 'rgba(255,180,90,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(o.x, o.y, r * 3.2, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#fffdf0';
    ctx.beginPath(); ctx.arc(o.x, o.y, r * 0.55, 0, Math.PI * 2); ctx.fill();
}

function drawCloud(c) {
    ctx.save();
    ctx.fillStyle = 'rgba(38,28,56,.86)';
    const lobes = 5;
    for (let i = 0; i < lobes; i++) {
        const f = i / (lobes - 1);
        const cx = c.x - c.w / 2 + f * c.w;
        const cy = c.y + Math.sin(f * 3.1 + c.seed) * c.h * 0.18;
        const rr = c.h * (0.55 + Math.sin(f * Math.PI) * 0.55);
        ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.fill();
    }
    // Alt kenardaki soğuk vurgular
    ctx.fillStyle = 'rgba(120,100,170,.25)';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y + c.h * 0.42, c.w * 0.42, c.h * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawBird(b) {
    ctx.strokeStyle = 'rgba(30,20,40,.55)';
    ctx.lineWidth = 1.6 * b.s;
    const w = 9 * b.s, f = Math.sin(b.ph) * 4 * b.s;
    ctx.beginPath();
    ctx.moveTo(b.x - w, b.y);
    ctx.quadraticCurveTo(b.x - w / 2, b.y - f - 3 * b.s, b.x, b.y);
    ctx.quadraticCurveTo(b.x + w / 2, b.y - f - 3 * b.s, b.x + w, b.y);
    ctx.stroke();
}

function render() {
    const col = skyColors(game.sun);
    const night = clamp((0.45 - game.sun) / 0.45, 0, 1);

    ctx.save();
    if (game.shake > 0) {
        ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
    }

    // Gökyüzü
    const sky = ctx.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, rgb(col.top));
    sky.addColorStop(0.55, rgb(col.mid));
    sky.addColorStop(1, rgb(col.low));
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, horizon);

    drawStars(night);
    const sunPos = drawSun(col);

    // Uzaktaki dekoratif kuşlar
    for (const b of birds) drawBird(b);

    // Arka plan bulut şeritleri
    ctx.save();
    const bandOff = game.scroll * 0.06;
    for (let i = 0; i < 5; i++) {
        const y = horizon * (0.18 + i * 0.13);
        const x = ((i * 380 - bandOff) % (W + 700) + W + 700) % (W + 700) - 350;
        ctx.fillStyle = rgba(mixRGB(col.low, [255, 255, 255], 0.35), 0.16);
        ctx.beginPath();
        ctx.ellipse(x, y, 160 + i * 30, 11 + i * 2, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    // Uzak dağlar → yakın tepeler (paralaks)
    ridge(horizon - 22, 46, 0.12, rgb(mixRGB(shade(col.mid, 0.45), col.top, 0.35)), 0.12);
    ridge(horizon - 6,  34, 0.28, rgb(shade(col.mid, 0.26)), 0.18);

    drawSea(col, sunPos);

    // Sudan çıkan ada silueti
    ridge(horizon + 26, 16, 0.55, rgb(shade(col.top, 0.16)), 0.3);

    // Oyun nesneleri
    for (const c of clouds) drawCloud(c);
    for (const o of orbs) drawOrb(o);

    for (const p of particles) {
        ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
        ctx.fillStyle = rgb(p.color);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (game.state === STATE.PLAY) drawPlayer();

    // Vinyet
    const vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, `rgba(6,4,20,${0.35 + night * 0.3})`);
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    ctx.restore();

    if (game.flash > 0) {
        ctx.fillStyle = `rgba(120,40,90,${game.flash * 0.45})`;
        ctx.fillRect(0, 0, W, H);
    }
}

/* --------------------------------------------------------------------------
   Ana döngü
   -------------------------------------------------------------------------- */

let last = performance.now();

function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
}

reset();
updateHUD();
requestAnimationFrame(loop);
</script>
</body>
</html>
